<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #1e293b;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .status {
            display: flex;
            gap: 1rem;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
        }

        .status-dot.offline {
            background: #ef4444;
        }

        .status-dot.loading {
            background: #eab308;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #3b82f6;
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .message.assistant {
            align-self: flex-start;
            background: #1e293b;
            color: #e2e8f0;
            border-bottom-left-radius: 0.25rem;
            border: 1px solid #334155;
        }

        .message.error {
            align-self: center;
            background: #7f1d1d;
            color: #fecaca;
            border: 1px solid #991b1b;
            max-width: 90%;
            text-align: center;
        }

        .message.system {
            align-self: center;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            max-width: 90%;
            text-align: center;
            font-size: 0.875rem;
        }

        .input-container {
            padding: 1rem 1.5rem;
            background: #1e293b;
            border-top: 1px solid #334155;
            display: flex;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .input-container input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.9375rem;
            outline: none;
        }

        .input-container input:focus {
            border-color: #3b82f6;
        }

        .input-container button {
            padding: 0.75rem 1.5rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-container button:hover:not(:disabled) {
            background: #2563eb;
        }

        .input-container button:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            align-items: center;
            gap: 0.5rem;
            color: #94a3b8;
            font-size: 0.875rem;
            padding: 0.5rem 1.5rem;
        }

        .loading.visible {
            display: flex;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4) infinite;
        }

        @keyframes dots {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }

        .state-panel {
            background: #1e293b;
            border-top: 1px solid #334155;
            padding: 1rem 1.5rem;
            font-size: 0.75rem;
            color: #94a3b8;
            display: none;
            flex-shrink: 0;
        }

        .state-panel.visible {
            display: block;
        }

        .state-panel h3 {
            color: #e2e8f0;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .state-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.75rem;
        }

        .state-item {
            background: #0f172a;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid #334155;
        }

        .state-item label {
            display: block;
            color: #64748b;
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .state-item value {
            color: #e2e8f0;
            font-weight: 500;
        }

        .toggle-state {
            background: none;
            border: 1px solid #475569;
            color: #94a3b8;
            padding: 0.25rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .toggle-state:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Arcon</h1>
            <div class="status" id="status">
                <div class="status-item">
                    <div class="status-dot loading" id="status-dot"></div>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>
        </div>
        <button class="toggle-state" id="toggle-state">State</button>
    </div>

    <div class="chat-container" id="chat">
        <div class="message system">
            Arcon V1 is active. Qwen3-4B + Arcon V1 LoRA.
        </div>
    </div>

    <div class="loading" id="loading">
        <span>Arcon is thinking</span>
        <span class="loading-dots"></span>
    </div>

    <div class="input-container">
        <input
            type="text"
            id="message-input"
            placeholder="Message Arcon..."
            autocomplete="off"
        />
        <button id="send-button">Send</button>
    </div>

    <div class="state-panel" id="state-panel">
        <h3>Runtime State</h3>
        <div class="state-grid" id="state-grid">
            <div class="state-item">
                <label>Inference</label>
                <value id="state-inference">-</value>
            </div>
            <div class="state-item">
                <label>Base Model</label>
                <value id="state-model">-</value>
            </div>
            <div class="state-item">
                <label>Adapter</label>
                <value id="state-adapter">-</value>
            </div>
            <div class="state-item">
                <label>Backend</label>
                <value id="state-backend">-</value>
            </div>
            <div class="state-item">
                <label>Mood</label>
                <value id="state-mood">-</value>
            </div>
            <div class="state-item">
                <label>Emotion</label>
                <value id="state-emotion">-</value>
            </div>
            <div class="state-item">
                <label>User Interests</label>
                <value id="state-user-interests">-</value>
            </div>
            <div class="state-item">
                <label>Arcon Interests</label>
                <value id="state-arcon-interests">-</value>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const chatContainer = document.getElementById('chat');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        const loading = document.getElementById('loading');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const toggleState = document.getElementById('toggle-state');
        const statePanel = document.getElementById('state-panel');

        let conversationId = null;
        let isGenerating = false;

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function setStatus(status, online) {
            statusText.textContent = status;
            statusDot.classList.remove('offline', 'loading');
            if (!online) {
                statusDot.classList.add('offline');
            } else if (status.includes('Thinking') || status.includes('Generating')) {
                statusDot.classList.add('loading');
            }
        }

        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    setStatus('Online', true);
                    return true;
                }
            } catch {
                setStatus('Offline', false);
                return false;
            }
            return false;
        }

        async function loadModelInfo() {
            try {
                const response = await fetch(`${API_BASE}/model-info`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('state-inference').textContent = data.inferenceBackend || 'unknown';
                    document.getElementById('state-backend').textContent = data.inferenceBackend || 'unknown';
                    if (data.model) {
                        document.getElementById('state-model').textContent = data.model.base_model || 'unknown';
                        document.getElementById('state-adapter').textContent = data.model.adapter_name || 'none';
                    }
                }
            } catch {
                // Model info not available
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isGenerating) return;

            isGenerating = true;
            messageInput.value = '';
            sendButton.disabled = true;
            loading.classList.add('visible');
            setStatus('Thinking...', true);

            addMessage('user', message);

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message,
                        conversationId,
                    }),
                });

                const data = await response.json();

                if (!response.ok) {
                    addMessage('error', data.error || 'Failed to send message');
                    setStatus('Error', true);
                    return;
                }

                if (data.conversationId && !conversationId) {
                    conversationId = data.conversationId;
                }

                addMessage('assistant', data.reply);
                setStatus('Online', true);
            } catch (error) {
                addMessage('error', 'Network error: ' + error.message);
                setStatus('Offline', false);
            } finally {
                isGenerating = false;
                messageInput.disabled = false;
                sendButton.disabled = false;
                loading.classList.remove('visible');
                messageInput.focus();
            }
        }

        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        toggleState.addEventListener('click', () => {
            statePanel.classList.toggle('visible');
        });

        async function init() {
            const online = await checkHealth();
            if (online) {
                await loadModelInfo();
                messageInput.focus();
            } else {
                addMessage('system', 'Cannot connect to Arcon server. Make sure the server is running.');
            }
        }

        init();

        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
